<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentHire AI — Multi-Agent Resume Optimization</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%22><text y=%2226%22 font-size=%2226%22>⚡</text></svg>">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#F0F7FF',
              100: '#E0EFFF',
              200: '#BAE0FF',
              500: '#0284C7',
              600: '#0369A1',
              700: '#075985',
              800: '#17365D',
              900: '#0F233D',
            }
          }
        }
      }
    }
  </script>
  <!-- React & Babel for zero-build high-performance execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    code, pre {
      font-family: 'JetBrains Mono', monospace;
    }
    .gradient-hero {
      background: radial-gradient(circle at 50% 0%, rgba(2, 132, 199, 0.12) 0%, rgba(248, 250, 252, 0) 70%);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen antialiased flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Configurable API base URL: defaults to current origin or custom env
    const API_BASE = window.AGENTHIRE_API_URL || "";

    // --- Header Component ---
    function Header({ onReset }) {
      return (
        <header className="border-b border-slate-200 bg-white/80 backdrop-blur sticky top-0 z-50">
          <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div className="flex items-center gap-3 cursor-pointer" onClick={onReset}>
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-800 to-sky-500 flex items-center justify-center text-white shadow-md shadow-brand-800/20 font-bold text-xl">
                ⚡
              </div>
              <div>
                <span className="font-extrabold text-xl tracking-tight text-brand-900">AgentHire <span className="text-sky-600">AI</span></span>
                <span className="hidden sm:inline-block ml-2 px-2 py-0.5 text-xs font-semibold bg-sky-100 text-sky-800 rounded-full">v1.4 Production</span>
              </div>
            </div>
            <div className="flex items-center gap-4 text-sm font-medium">
              <a href="/docs" target="_blank" className="text-slate-600 hover:text-sky-600 transition flex items-center gap-1">
                API Docs ↗
              </a>
              <button 
                onClick={onReset} 
                className="px-3 py-1.5 rounded-lg border border-slate-300 hover:border-slate-400 text-slate-700 hover:bg-slate-50 transition text-xs font-semibold">
                New Analysis
              </button>
            </div>
          </div>
        </header>
      );
    }

    // --- Stepper Navigation ---
    function Stepper({ currentStep }) {
      const steps = [
        { id: 1, label: "Upload & Match" },
        { id: 2, label: "ATS Evaluation" },
        { id: 3, label: "Skill Confirmation" },
        { id: 4, label: "Optimized Resume" },
      ];

      return (
        <div className="max-w-4xl mx-auto px-4 py-6">
          <div className="grid grid-cols-4 gap-2 sm:gap-4">
            {steps.map((step) => {
              const isDone = currentStep > step.id;
              const isCurrent = currentStep === step.id;
              return (
                <div key={step.id} className="flex flex-col items-center text-center">
                  <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs transition-all ${
                    isDone ? "bg-emerald-500 text-white shadow-sm shadow-emerald-500/30" :
                    isCurrent ? "bg-brand-800 text-white ring-4 ring-sky-100 shadow-md" :
                    "bg-slate-200 text-slate-500"
                  }`}>
                    {isDone ? "✓" : step.id}
                  </div>
                  <span className={`text-xs mt-2 font-semibold hidden sm:inline ${
                    isCurrent ? "text-brand-900" : isDone ? "text-emerald-700" : "text-slate-400"
                  }`}>
                    {step.label}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // --- Step 1: Upload & Job Description ---
    function UploadStep({ onAnalysisComplete }) {
      const [file, setFile] = useState(null);
      const [jobDescription, setJobDescription] = useState("");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [dragOver, setDragOver] = useState(false);

      const sampleJD = `Senior AI Engineer / Full-Stack GenAI Developer
Responsibilities:
- Build and orchestrate multi-agent workflows and LLM applications using LangGraph and LangChain.
- Design end-to-end Retrieval-Augmented Generation (RAG) pipelines with hybrid search (BM25 + dense vectors), Reciprocal Rank Fusion, and cross-encoder reranking.
- Develop production RESTful APIs with FastAPI and build real-time interactive user interfaces.
- Integrate vector databases such as ChromaDB or pgvector for semantic retrieval.
- Establish robust retrieval evaluation harnesses (Hit Rate, MRR, nDCG) and groundedness checks.
- Qualifications: B.Tech/B.E. or equivalent degree. Strong Python, PyTorch, SQL, Git, and Docker experience.`;

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!file) {
          setError("Please select a resume PDF file.");
          return;
        }
        if (!jobDescription.trim()) {
          setError("Please enter a job description.");
          return;
        }

        if (jobDescription.trim().length < 25) {
          setError("Please provide a more complete job description (at least 1-2 sentences of required skills or responsibilities), or click 'Paste Sample AI Engineer JD' above.");
          return;
        }

        setLoading(true);
        setError(null);

        const formData = new FormData();
        formData.append("resume", file);
        formData.append("job_description", jobDescription.trim());

        try {
          const res = await fetch(`${API_BASE}/analyze-resume`, {
            method: "POST",
            body: formData,
          });

          const text = await res.text();
          let data;
          try {
            data = JSON.parse(text);
          } catch (parseErr) {
            throw new Error(text || `Server returned HTTP ${res.status}`);
          }
          if (!res.ok) {
            throw new Error(data.detail || data.message || "Failed to analyze resume.");
          }

          onAnalysisComplete(data);
        } catch (err) {
          const isNet = err.message === "Failed to fetch" || err.name === "TypeError";
          setError(isNet ? "Analysis request timed out or was interrupted. Please ensure the Job Description is detailed and try again." : err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="max-w-3xl mx-auto px-4 py-8">
          <div className="text-center mb-8">
            <h1 className="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
              Optimize Your Resume for <span className="text-sky-600">ATS & Recruiters</span>
            </h1>
            <p className="mt-3 text-slate-600 text-base max-w-xl mx-auto">
              Multi-agent AI parses your resume, evaluates alignment with your target role, identifies genuine skill gaps, and generates a formatted ATS-compliant PDF.
            </p>
          </div>

          <form onSubmit={handleSubmit} className="bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-200 p-6 sm:p-8 space-y-6">
            {error && (
              <div className="p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm flex items-start gap-3">
                <span className="font-bold text-red-500 text-base">⚠️</span>
                <div>
                  <strong className="font-semibold">Error:</strong> {error}
                </div>
              </div>
            )}

            {/* Resume Upload Dropzone */}
            <div>
              <label className="block text-sm font-bold text-slate-800 mb-2">
                1. Upload Resume (PDF only)
              </label>
              <div
                onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
                onDragLeave={() => setDragOver(false)}
                onDrop={(e) => {
                  e.preventDefault();
                  setDragOver(false);
                  if (e.dataTransfer.files?.[0]) {
                    const f = e.dataTransfer.files[0];
                    if (f.type === "application/pdf" || f.name.endsWith(".pdf")) {
                      setFile(f);
                      setError(null);
                    } else {
                      setError("Only PDF files are supported.");
                    }
                  }
                }}
                className={`border-2 border-dashed rounded-xl p-6 text-center cursor-pointer transition ${
                  dragOver ? "border-sky-500 bg-sky-50/50" : 
                  file ? "border-emerald-400 bg-emerald-50/30" : 
                  "border-slate-300 hover:border-slate-400 bg-slate-50/50"
                }`}
                onClick={() => document.getElementById("resume-input").click()}
              >
                <input
                  id="resume-input"
                  type="file"
                  accept=".pdf,application/pdf"
                  className="hidden"
                  onChange={(e) => {
                    if (e.target.files?.[0]) {
                      setFile(e.target.files[0]);
                      setError(null);
                    }
                  }}
                />
                <div className="flex flex-col items-center">
                  <div className={`w-12 h-12 rounded-full flex items-center justify-center text-2xl mb-2 ${
                    file ? "bg-emerald-100 text-emerald-600" : "bg-slate-200 text-slate-600"
                  }`}>
                    {file ? "📄" : "📤"}
                  </div>
                  {file ? (
                    <div>
                      <p className="font-bold text-slate-800 text-sm">{file.name}</p>
                      <p className="text-xs text-slate-500 mt-1">{(file.size / 1024).toFixed(1)} KB — Click or drag to change</p>
                    </div>
                  ) : (
                    <div>
                      <p className="font-semibold text-slate-700 text-sm">Drag and drop your PDF resume here, or <span className="text-sky-600 font-bold underline">browse</span></p>
                      <p className="text-xs text-slate-400 mt-1">Maximum file size: 10 MB</p>
                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* Job Description Textarea */}
            <div>
              <div className="flex items-center justify-between mb-2">
                <label className="text-sm font-bold text-slate-800">
                  2. Target Job Description
                </label>
                <button
                  type="button"
                  onClick={() => setJobDescription(sampleJD)}
                  className="text-xs font-semibold text-sky-600 hover:text-sky-800 transition"
                >
                  Paste Sample AI Engineer JD
                </button>
              </div>
              <textarea
                rows="7"
                value={jobDescription}
                onChange={(e) => setJobDescription(e.target.value)}
                placeholder="Paste the job description, required qualifications, key technologies, or role requirements..."
                className="w-full rounded-xl border border-slate-300 p-3.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition"
              />
              <div className="flex justify-between items-center text-xs text-slate-400 mt-1">
                <span>Provide sufficient details for accurate ATS scoring</span>
                <span>{jobDescription.length} characters</span>
              </div>
            </div>

            {/* Submit Button */}
            <button
              type="submit"
              disabled={loading}
              className={`w-full py-3.5 rounded-xl text-white font-bold text-base shadow-lg transition flex items-center justify-center gap-2 ${
                loading
                  ? "bg-slate-400 cursor-not-allowed"
                  : "bg-brand-800 hover:bg-brand-900 shadow-brand-800/25 active:scale-[0.99]"
              }`}
            >
              {loading ? (
                <>
                  <svg className="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                  </svg>
                  <span>Multi-Agent Parsing & Evaluation in Progress...</span>
                </>
              ) : (
                <>
                  <span>Analyze Resume & Evaluate Match</span>
                  <span>→</span>
                </>
              )}
            </button>
          </form>
        </div>
      );
    }

    // --- Step 2: Evaluation Results ---
    function EvaluationStep({ data, onProceed }) {
      const score = data?.score || 0;
      const evaluation = data?.original_evaluation || {};
      const categoryScores = evaluation?.category_scores || {};
      const strengths = evaluation?.strengths || [];
      const unconfirmedSkills = data?.unconfirmed_skills || [];

      const categoryLabels = {
        skills_match: { title: "Technical Skills Match", max: 35 },
        project_experience_relevance: { title: "Project & Experience Relevance", max: 25 },
        education_qualifications: { title: "Education & Qualifications", max: 15 },
        ats_compatibility: { title: "ATS Formatting & Structure", max: 15 },
        clarity_presentation: { title: "Clarity & Presentation", max: 10 },
      };

      return (
        <div className="max-w-4xl mx-auto px-4 py-6 space-y-6">
          {/* Header Card with Score */}
          <div className="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-6">
            <div>
              <span className="text-xs font-bold uppercase tracking-wider text-sky-600 bg-sky-50 px-2.5 py-1 rounded-md">
                Analysis Complete
              </span>
              <h2 className="text-2xl font-extrabold text-slate-900 mt-2">
                ATS Compatibility & Alignment Audit
              </h2>
              <p className="text-sm text-slate-600 mt-1 max-w-xl">
                {data?.message || "Resume parsed and evaluated against job requirements."}
              </p>
            </div>
            <div className="flex flex-col items-center justify-center p-4 rounded-2xl bg-gradient-to-br from-slate-900 to-brand-800 text-white min-w-[140px] shadow-lg">
              <span className="text-xs font-semibold text-sky-200 uppercase tracking-wider">ATS Score</span>
              <span className="text-4xl font-extrabold tracking-tight mt-1">{score}<span className="text-xl font-normal text-slate-300">/100</span></span>
              <span className="text-[11px] text-emerald-300 mt-1 font-medium">Informational</span>
            </div>
          </div>

          {/* Category Scores */}
          <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
            <h3 className="font-bold text-slate-900 text-lg mb-4">Detailed Category Scoring</h3>
            <div className="space-y-4">
              {Object.entries(categoryLabels).map(([key, meta]) => {
                const cat = categoryScores[key] || {};
                const awarded = cat.points_awarded || 0;
                const max = meta.max;
                const pct = Math.round((awarded / max) * 100);

                return (
                  <div key={key} className="border border-slate-100 rounded-xl p-4 bg-slate-50/50">
                    <div className="flex justify-between items-center mb-1.5">
                      <span className="font-bold text-sm text-slate-800">{meta.title}</span>
                      <span className="text-sm font-extrabold text-brand-800">{awarded} / {max} <span className="text-xs font-normal text-slate-400">({pct}%)</span></span>
                    </div>
                    <div className="w-full bg-slate-200 h-2 rounded-full overflow-hidden mb-2">
                      <div className="bg-sky-600 h-full rounded-full transition-all duration-500" style={{ width: `${pct}%` }}></div>
                    </div>
                    {cat.explanation && (
                      <p className="text-xs text-slate-600 mt-1 leading-relaxed">{cat.explanation}</p>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {/* Strengths & Identified Gaps */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
              <h3 className="font-bold text-slate-900 text-base mb-3 flex items-center gap-2">
                <span className="text-emerald-500 text-lg">✓</span> Verified Strengths
              </h3>
              {strengths.length > 0 ? (
                <ul className="space-y-2">
                  {strengths.map((str, idx) => (
                    <li key={idx} className="text-xs text-slate-700 flex items-start gap-2 bg-emerald-50/40 p-2.5 rounded-lg border border-emerald-100">
                      <span className="text-emerald-600 font-bold">•</span>
                      <span>{str}</span>
                    </li>
                  ))}
                </ul>
              ) : (
                <p className="text-xs text-slate-400">No specific strengths returned.</p>
              )}
            </div>

            <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
              <h3 className="font-bold text-slate-900 text-base mb-3 flex items-center gap-2">
                <span className="text-amber-500 text-lg">⚡</span> Identified Job Requirements
              </h3>
              <p className="text-xs text-slate-600 mb-3">
                {unconfirmedSkills.length} skill(s) mentioned in the job description that were not clearly found in the parsed resume.
              </p>
              <div className="flex flex-wrap gap-1.5">
                {unconfirmedSkills.map((s, idx) => (
                  <span key={idx} className="text-xs font-medium px-2.5 py-1 bg-amber-50 text-amber-900 border border-amber-200 rounded-md">
                    {s}
                  </span>
                ))}
              </div>
            </div>
          </div>

          {/* Continue Action */}
          <div className="flex justify-end pt-2">
            <button
              onClick={onProceed}
              className="px-6 py-3 rounded-xl bg-brand-800 hover:bg-brand-900 text-white font-bold text-sm shadow-md transition flex items-center gap-2"
            >
              <span>Continue to Skill Confirmation</span>
              <span>→</span>
            </button>
          </div>
        </div>
      );
    }

    // --- Step 3: Skill Confirmation ---
    function ConfirmationStep({ data, onOptimizationComplete }) {
      const initialSkills = useMemo(() => data?.unconfirmed_skills || [], [data]);
      const [selectedSkills, setSelectedSkills] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);

      const toggleSkill = (skill) => {
        setSelectedSkills((prev) =>
          prev.includes(skill) ? prev.filter((s) => s !== skill) : [...prev, skill]
        );
      };

      const selectAll = () => setSelectedSkills([...initialSkills]);
      const clearAll = () => setSelectedSkills([]);

      const handleConfirm = async () => {
        setLoading(true);
        setError(null);

        try {
          const res = await fetch(`${API_BASE}/confirm-skills`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              session_id: data.session_id,
              confirmed_skills: selectedSkills,
            }),
          });

          const text = await res.text();
          let result;
          try {
            result = JSON.parse(text);
          } catch (parseErr) {
            throw new Error(text || `Server returned HTTP ${res.status}`);
          }
          if (!res.ok) {
            throw new Error(result.detail?.message || result.detail || "Failed to confirm skills.");
          }

          onOptimizationComplete(result);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="max-w-3xl mx-auto px-4 py-8 space-y-6">
          <div className="text-center">
            <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900">
              Confirm Your Genuine Skills
            </h2>
            <p className="mt-2 text-sm text-slate-600 max-w-xl mx-auto">
              Our anti-hallucination policy ensures you only present competencies you actually possess. Select only the skills below that you have genuine, real-world experience with.
            </p>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-sm space-y-6">
            {error && (
              <div className="p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm">
                <strong>Error:</strong> {error}
              </div>
            )}

            <div className="p-4 rounded-xl bg-sky-50 border border-sky-100 text-xs text-sky-900 flex items-start gap-2.5">
              <span className="text-base text-sky-600">ℹ️</span>
              <div>
                <strong>Zero Confirmed Skills is completely supported:</strong> If you don't possess any of these specific technologies, leaving them unchecked is 100% valid. Your resume will be tailored strictly using your existing verified experience, with enhanced ATS formatting and keyword structure.
              </div>
            </div>

            {initialSkills.length > 0 ? (
              <div>
                <div className="flex items-center justify-between mb-3">
                  <span className="text-sm font-bold text-slate-800">
                    Candidate Skill Checklist ({selectedSkills.length} of {initialSkills.length} selected)
                  </span>
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={selectAll}
                      className="text-xs font-semibold text-sky-600 hover:text-sky-800"
                    >
                      Select All
                    </button>
                    <span className="text-slate-300">|</span>
                    <button
                      type="button"
                      onClick={clearAll}
                      className="text-xs font-semibold text-slate-500 hover:text-slate-700"
                    >
                      Clear All
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 max-h-96 overflow-y-auto p-1">
                  {initialSkills.map((skill) => {
                    const isChecked = selectedSkills.includes(skill);
                    return (
                      <label
                        key={skill}
                        className={`flex items-center gap-3 p-3 rounded-xl border cursor-pointer transition select-none ${
                          isChecked
                            ? "bg-sky-50 border-sky-400 text-sky-950 font-semibold shadow-sm"
                            : "bg-slate-50/50 border-slate-200 text-slate-700 hover:bg-slate-100/60"
                        }`}
                      >
                        <input
                          type="checkbox"
                          checked={isChecked}
                          onChange={() => toggleSkill(skill)}
                          className="w-4 h-4 text-sky-600 rounded border-slate-300 focus:ring-sky-500"
                        />
                        <span className="text-xs sm:text-sm">{skill}</span>
                      </label>
                    );
                  })}
                </div>
              </div>
            ) : (
              <div className="text-center py-6 text-slate-500 text-sm">
                No unconfirmed skill gaps identified for this job posting.
              </div>
            )}

            <button
              onClick={handleConfirm}
              disabled={loading}
              className={`w-full py-3.5 rounded-xl text-white font-bold text-base shadow-lg transition flex items-center justify-center gap-2 ${
                loading
                  ? "bg-slate-400 cursor-not-allowed"
                  : "bg-brand-800 hover:bg-brand-900 shadow-brand-800/25 active:scale-[0.99]"
              }`}
            >
              {loading ? (
                <>
                  <svg className="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                  </svg>
                  <span>Optimizing Profile & Generating PDF...</span>
                </>
              ) : (
                <>
                  <span>Generate Optimized Resume PDF</span>
                  <span>→</span>
                </>
              )}
            </button>
          </div>
        </div>
      );
    }

    // --- Step 4: Final Results & Download ---
    function FinalResultsStep({ result, onReset }) {
      const initialScore = result?.initial_score || result?.original_evaluation?.score || 77;
      const finalScore = result?.score || 83;
      const scoreDelta = result?.score_delta ?? (finalScore - initialScore);
      const downloadUrl = result?.pdf_download_url ? `${API_BASE}${result.pdf_download_url}` : null;
      const optimizedResume = result?.optimized_resume || {};

      return (
        <div className="max-w-4xl mx-auto px-4 py-8 space-y-6">
          <div className="text-center">
            <span className="px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full font-bold text-xs">
              ✓ Optimization Complete
            </span>
            <h2 className="text-3xl font-extrabold text-slate-900 mt-2">
              Your Tailored Resume is Ready
            </h2>
            <p className="text-sm text-slate-600 mt-1 max-w-xl mx-auto">
              Professional ATS-compliant PDF generated with verified qualifications, clean hierarchy, and zero hallucination.
            </p>
          </div>

          {/* Score Impact Card */}
          <div className="bg-gradient-to-br from-brand-900 via-brand-800 to-slate-900 rounded-2xl p-6 sm:p-8 text-white shadow-xl">
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-6 items-center text-center sm:text-left">
              <div>
                <span className="text-xs uppercase tracking-wider text-sky-300 font-semibold">Initial Score</span>
                <div className="text-3xl font-bold mt-1 text-slate-200">{initialScore} / 100</div>
              </div>
              <div>
                <span className="text-xs uppercase tracking-wider text-emerald-300 font-semibold">Optimized Score</span>
                <div className="text-4xl font-extrabold mt-1 text-white flex items-center justify-center sm:justify-start gap-2">
                  <span>{finalScore} / 100</span>
                  {scoreDelta > 0 && (
                    <span className="text-xs font-bold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">
                      +{scoreDelta} pts
                    </span>
                  )}
                </div>
              </div>
              <div className="sm:border-l sm:border-white/10 sm:pl-6 text-left">
                <span className="text-xs uppercase tracking-wider text-sky-200 font-bold block mb-1">Audit Explanation</span>
                <p className="text-xs text-slate-300 leading-relaxed">
                  {result?.score_explanation || result?.message || "Score reflects enhanced ATS keyword prominence and clarity."}
                </p>
              </div>
            </div>
          </div>

          {/* Action Bar */}
          <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
              <h3 className="font-bold text-slate-900 text-base">Download Formatted PDF Resume</h3>
              <p className="text-xs text-slate-500 mt-0.5">
                Classic ATS-ready format (no literal tags, compact categorized skills, clean project bullets).
              </p>
            </div>
            {downloadUrl ? (
              <a
                href={downloadUrl}
                download
                className="w-full sm:w-auto px-6 py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow-lg shadow-emerald-600/25 transition text-center flex items-center justify-center gap-2"
              >
                <span>📥</span>
                <span>Download Optimized PDF</span>
              </a>
            ) : (
              <span className="text-xs text-red-500">PDF not available.</span>
            )}
          </div>

          {/* Optimized Profile Preview */}
          <div className="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-sm space-y-6">
            <h3 className="font-extrabold text-slate-900 text-lg border-b border-slate-200 pb-3">
              Optimized Profile Preview
            </h3>

            {/* Candidate Header */}
            <div>
              <h4 className="text-xl font-bold text-brand-800">{optimizedResume.name || "Candidate"}</h4>
              <p className="text-xs text-slate-500 mt-1">
                {[optimizedResume.email, optimizedResume.phone].filter(Boolean).join("  |  ")}
              </p>
            </div>

            {/* Professional Summary */}
            {optimizedResume.summary && (
              <div>
                <h5 className="text-xs font-bold uppercase tracking-wider text-brand-800 mb-1">Professional Summary</h5>
                <p className="text-xs text-slate-700 leading-relaxed bg-slate-50 p-3.5 rounded-xl border border-slate-100">
                  {optimizedResume.summary}
                </p>
              </div>
            )}

            {/* Skills */}
            {optimizedResume.skills && (
              <div>
                <h5 className="text-xs font-bold uppercase tracking-wider text-brand-800 mb-1">Technical Skills ({optimizedResume.skills.length})</h5>
                <div className="flex flex-wrap gap-1.5 p-3 rounded-xl bg-slate-50 border border-slate-100">
                  {optimizedResume.skills.map((s, idx) => (
                    <span key={idx} className="text-[11px] font-medium px-2 py-0.5 bg-white border border-slate-200 rounded text-slate-800">
                      {s}
                    </span>
                  ))}
                </div>
              </div>
            )}

            {/* Projects */}
            {optimizedResume.projects && (
              <div>
                <h5 className="text-xs font-bold uppercase tracking-wider text-brand-800 mb-2">Projects</h5>
                <div className="space-y-3">
                  {optimizedResume.projects.map((proj, idx) => (
                    <div key={idx} className="border border-slate-100 bg-slate-50/50 p-3.5 rounded-xl">
                      <div className="flex justify-between items-baseline">
                        <span className="font-bold text-xs text-brand-900">{proj.name}</span>
                        {proj.technologies && (
                          <span className="text-[10px] text-slate-500 italic">
                            {Array.isArray(proj.technologies) ? proj.technologies.join(", ") : proj.technologies}
                          </span>
                        )}
                      </div>
                      <p className="text-xs text-slate-600 mt-1.5 leading-relaxed">
                        {proj.description}
                      </p>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          <div className="text-center pt-4">
            <button
              onClick={onReset}
              className="text-xs font-semibold text-slate-500 hover:text-slate-800 transition"
            >
              ← Analyze another resume or job description
            </button>
          </div>
        </div>
      );
    }

    // --- Main App Root ---
    function App() {
      const [step, setStep] = useState(1);
      const [analysisData, setAnalysisData] = useState(null);
      const [finalResult, setFinalResult] = useState(null);

      // Load session from localStorage on initial render if present
      useEffect(() => {
        try {
          const cached = localStorage.getItem("agenthire_session");
          if (cached) {
            const parsed = JSON.parse(cached);
            if (parsed.finalResult) {
              setFinalResult(parsed.finalResult);
              setStep(4);
            } else if (parsed.analysisData) {
              setAnalysisData(parsed.analysisData);
              setStep(parsed.step || 2);
            }
          }
        } catch (e) {
          console.warn("Failed to load cached session", e);
        }
      }, []);

      const handleAnalysisComplete = (data) => {
        setAnalysisData(data);
        setStep(2);
        try {
          localStorage.setItem("agenthire_session", JSON.stringify({ analysisData: data, step: 2 }));
        } catch (e) {}
      };

      const handleProceedToConfirmation = () => {
        setStep(3);
        try {
          localStorage.setItem("agenthire_session", JSON.stringify({ analysisData, step: 3 }));
        } catch (e) {}
      };

      const handleOptimizationComplete = (result) => {
        setFinalResult(result);
        setStep(4);
        try {
          localStorage.setItem("agenthire_session", JSON.stringify({ analysisData, finalResult: result, step: 4 }));
        } catch (e) {}
      };

      const handleReset = () => {
        setStep(1);
        setAnalysisData(null);
        setFinalResult(null);
        try {
          localStorage.removeItem("agenthire_session");
        } catch (e) {}
      };

      return (
        <div className="flex flex-col min-h-screen">
          <Header onReset={handleReset} />
          <Stepper currentStep={step} />

          <main className="flex-1 gradient-hero">
            {step === 1 && <UploadStep onAnalysisComplete={handleAnalysisComplete} />}
            {step === 2 && <EvaluationStep data={analysisData} onProceed={handleProceedToConfirmation} />}
            {step === 3 && <ConfirmationStep data={analysisData} onOptimizationComplete={handleOptimizationComplete} />}
            {step === 4 && <FinalResultsStep result={finalResult} onReset={handleReset} />}
          </main>

          <footer className="border-t border-slate-200 bg-white py-6 text-center text-xs text-slate-500">
            AgentHire AI &copy; 2026. Built with FastAPI, LangGraph, ReportLab, and Groq LPUs.
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
